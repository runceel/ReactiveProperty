name: Unit testing

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.x

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDKs and runtimes
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          ${{ env.DOTNET_VERSION }}
    - name: Install dependencies
      run: dotnet restore ReactiveProperty.slnx
    - name: Build all package targets
      run: dotnet build ReactiveProperty.slnx -c Release --no-restore
    - name: Test .NET 10 and .NET 11
      run: dotnet test ReactiveProperty.slnx --no-restore --verbosity normal
